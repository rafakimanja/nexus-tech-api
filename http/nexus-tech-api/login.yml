info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/login/v2"
  body:
    type: json
    data: |-
      {
        "idToken": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
