info:
  name: Substituir Areas Professor
  type: http
  seq: 3

http:
  method: PUT
  url: "{{url}}/teachers/{{professor_id}}/areas"
  body:
    type: json
    data: |-
      {
        "areas": [
          {"areas_id": 1, "type": "técnica"},
          {"areas_id": 2, "type": "interesse"}
        ]
      }
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
