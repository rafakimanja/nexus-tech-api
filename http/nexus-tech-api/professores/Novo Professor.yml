info:
  name: Novo Professor
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/teachers/"
  body:
    type: json
    data: |-
      {
        "name": "Nome do professor",
        "photo_url": null,
        "siape": "0123456",
        "areas": [
          {"areas_id": 1, "type": "técnica"},
          {"areas_id": 2, "type": "interesse"}
        ]
      }
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
